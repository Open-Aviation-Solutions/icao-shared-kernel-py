[package]
name = "icao-shared-kernel-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings (PyO3) for the icao-shared-kernel Rust domain crate."
publish = false

[lib]
name = "_icao_shared_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
# TEMPORARY: pinned to the aircraft-flight-with-id branch (PR #2) pending
# review, for Aircraft::with/Flight::with (needed by filesystem persistence
# in task 0002). Switch back to branch = "main" once that PR merges.
icao-shared-kernel = { git = "https://github.com/Open-Aviation-Solutions/icao-shared-kernel-rs", branch = "aircraft-flight-with-id", version = "0.1.0" }
pyo3 = { version = "0.29.0", features = ["extension-module", "time"] }
rust_decimal = "1.42.1"
time = { version = "0.3.54", features = ["formatting", "parsing"] }
uuid = { version = "1.24.0", features = ["v4"] }
