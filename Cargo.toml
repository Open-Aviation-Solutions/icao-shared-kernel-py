[package]
name = "icao-shared-kernel-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings (PyO3) for the icao-shared-kernel Rust domain crate."
publish = false

[lib]
name = "icao_shared_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
icao-shared-kernel = { git = "https://github.com/Open-Aviation-Solutions/icao-shared-kernel-rs", branch = "add-fstd-aggregates", version = "0.1.0" }
pyo3 = { version = "0.29.0", features = ["extension-module", "time"] }
rust_decimal = "1.42.1"
time = { version = "0.3.54", features = ["formatting", "parsing"] }
uuid = { version = "1.24.0", features = ["v4"] }
